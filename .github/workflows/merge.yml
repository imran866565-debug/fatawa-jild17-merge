name: Merge Jild 17 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild17.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-17.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined = {
              'jild17-masala-33': [119, 120, 121],
              'jild17-masala-141': [320, 321, 322],
              'jild17-masala-198': [370, 371, 372, 373, 374],
              'jild17-masala-255': [610, 611, 612, 613],
              'jild17-280': list(range(657, 671)),
              'jild17-masala-217': list(range(395, 503)),
              'jild17-masala-219': list(range(505, 561)),
          }
          for cid, expected_pages in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
          # absorbed parts must be gone (risala 1 + risala 2 tails)
          for sid in ['jild17-kasir-6', 'jild17-kasir-7', 'jild17-kasir-8', 'jild17-kasir-9',
                      'jild17-kasir-10', 'jild17-kasir-11', 'jild17-p471', 'jild17-p483', 'jild17-p486',
                      'jild17-masala-12', 'jild17-p506', 'jild17-p514', 'jild17-p521', 'jild17-p522',
                      'jild17-p523', 'jild17-p524', 'jild17-p526', 'jild17-p527', 'jild17-p528',
                      'jild17-p529', 'jild17-p531', 'jild17-p536', 'jild17-p537', 'jild17-p539',
                      'jild17-p544', 'jild17-p546', 'jild17-p550', 'jild17-p553', 'jild17-p557']:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been combined away'
          print('30 absorbed risala parts gone')
          # renamed bare ids must be gone
          for sid in ['jild17-33', 'jild17-141', 'jild17-255']:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been renamed'
          print('3 renamed bare ids gone')
          # risala 2 sawal is EMPTY by design (no printed question)
          m219 = [it for it in items if it['id'] == 'jild17-masala-219'][0]
          assert m219['tashreeh_sawal'] == '', 'masala-219 sawal must be empty by design'
          print('masala-219 sawal empty by design')
          # distinct items kept separate
          for did in ['jild17-masala-75', 'jild17-p173', 'jild17-257', 'jild17-p615',
                      'jild17-6-16', 'jild17-masala-218', 'jild17-pesh-lafz', 'jild17-khatima']:
              assert any(it['id'] == did for it in items), f'missing distinct item {did}'
              print(did, 'present')
          assert len(items) == 252
          assert len(pages) == 630
          assert min(pages) == 6 and max(pages) == 715
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-17.json
          gh release create v1.0 jild-17.json --title "Jild 17 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 17: 252 items, 630 pages (volume_id 53). Generated by merge_jild17.py from the 13 chunk files; 7 combine cases (masala-33, masala-141, masala-198, masala-255, masala-280, masala-217 risala 1 eleven-way, masala-219 risala 2 twenty-way)." || gh release upload v1.0 jild-17.json --clobber
